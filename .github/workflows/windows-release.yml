name: Windows release package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: bun install --frozen-lockfile
      - name: Verify tagged version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ' }
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test packages/backend/tests/original-samples.test.ts packages/backend/tests/desktop-lifecycle.test.ts --timeout 30000
      - run: dotnet run --project packages/desktop-windows/qa/UpdateChecks.csproj -c Release
      - run: bun run build:windows:release
      - uses: actions/upload-artifact@v4
        with:
          name: BurnGuard-Windows
          path: dist/releases/*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist/releases -File).FullName
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "BurnGuard $env:GITHUB_REF_NAME" --notes 'Windows installer, portable app, and automatic update feed. Publish this draft after checking the package.'
