<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><title>Colors · Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background:var(--bg); }
  .row { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .sw { min-height: 64px; box-sizing: border-box; display:flex; flex-direction:column; justify-content:flex-end; padding: 4px; font-family: var(--font-mono); font-size: 10px; line-height: 1.2; }
  .sw .n { font-weight: 600; }
  .label { font-family: var(--font-sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 10px; }
</style></head>
<body>
  <div class="label">Gray · 10 → 100</div>
  <div class="row" id="grays">
    <div class="sw" data-token="gray-10" style="background:var(--gray-10);color:var(--fg-1)"><span class="n">10</span></div>
    <div class="sw" data-token="gray-20" style="background:var(--gray-20);color:var(--fg-1)"><span class="n">20</span></div>
    <div class="sw" data-token="gray-30" style="background:var(--gray-30);color:var(--fg-1)"><span class="n">30</span></div>
    <div class="sw" data-token="gray-40" style="background:var(--gray-40);color:var(--fg-1)"><span class="n">40</span></div>
    <div class="sw" data-token="gray-50" style="background:var(--gray-50);color:var(--fg-on-dark)"><span class="n">50</span></div>
    <div class="sw" data-token="gray-60" style="background:var(--gray-60);color:var(--fg-on-dark)"><span class="n">60</span></div>
    <div class="sw" data-token="gray-70" style="background:var(--gray-70);color:var(--fg-on-dark)"><span class="n">70</span></div>
    <div class="sw" data-token="gray-80" style="background:var(--gray-80);color:var(--fg-on-dark)"><span class="n">80</span></div>
    <div class="sw" data-token="gray-90" style="background:var(--gray-90);color:var(--fg-on-dark)"><span class="n">90</span></div>
    <div class="sw" data-token="gray-100" style="background:var(--gray-100);color:var(--fg-1)"><span class="n">100</span></div>
  </div>
</body></html>
