<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Canvas move: what sits in a line</title>
<style>body{margin:0;padding:40px;font-family:system-ui,sans-serif;font-size:22px}
p{margin:0 0 28px}
.k-inline-block{display:inline-block;background:#fde68a}
.k-svg{background:#cbd5e1}</style></head>
<body><p>Before <span class="k-span">a span</span> after</p>
<p>Before <a class="k-link" href="#">a link</a> after</p>
<p>Before <em class="k-em">emphasis</em> after</p>
<p>Before <span class="k-inline-block">an inline block</span> after</p>
<p>Before <img class="k-img" width="40" height="30" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"> after</p>
<p>Before <svg class="k-svg" width="40" height="30"></svg> after</p>
<p>Before <svg width="40" height="30"><rect class="k-svg-rect" width="40" height="30" fill="#60a5fa"></rect></svg> after</p>
<p>Before <button class="k-button" type="button">a button</button> after</p></body></html>
