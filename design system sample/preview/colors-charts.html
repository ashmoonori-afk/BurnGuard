<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><title>Colors · Data viz</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background:var(--bg); font-family: var(--font-sans); }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 14px; }
  .row { display:flex; gap: 0; align-items:flex-end; height: 90px; padding-top: 12px; }
  .bar { flex: 1; border-right: 1px solid var(--bg); position: relative; color: var(--fg-on-dark); font-family: var(--font-mono); font-size: 10px; padding: 6px 4px; }
  .legend { display:grid; grid-template-columns: repeat(5, 1fr); gap: 6px 12px; margin-top: 14px; }
  .lg { display:flex; align-items:center; gap: 6px; font-size: 11px; color: var(--fg-2); }
  @media (max-width: 480px) { .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .sq { width: 12px; height: 12px; border-radius: 2px; }
</style></head>
<body>
  <div class="label">Chart palette · 1 → 10</div>
  <div class="row" id="bars">
    <div class="bar" data-swatch="chart-1" style="background:var(--chart-1);height:90%">1</div>
    <div class="bar" data-swatch="chart-2" style="background:var(--chart-2);height:76%">2</div>
    <div class="bar" data-swatch="chart-3" style="background:var(--chart-3);height:82%">3</div>
    <div class="bar" data-swatch="chart-4" style="background:var(--chart-4);height:55%">4</div>
    <div class="bar" data-swatch="chart-5" style="background:var(--chart-5);height:68%">5</div>
    <div class="bar" data-swatch="chart-6" style="background:var(--chart-6);height:90%">6</div>
    <div class="bar" data-swatch="chart-7" style="background:var(--chart-7);height:48%">7</div>
    <div class="bar" data-swatch="chart-8" style="background:var(--chart-8);height:72%">8</div>
    <div class="bar" data-swatch="chart-9" style="background:var(--chart-9);height:60%">9</div>
    <div class="bar" data-swatch="chart-10" style="background:var(--chart-10);height:84%">10</div>
  </div>
  <div class="legend" id="lg">
    <div class="lg"><span class="sq" data-swatch="chart-1" style="background:var(--chart-1)"></span>Blue 70</div>
    <div class="lg"><span class="sq" data-swatch="chart-2" style="background:var(--chart-2)"></span>Orange 50</div>
    <div class="lg"><span class="sq" data-swatch="chart-3" style="background:var(--chart-3)"></span>Teal 50</div>
    <div class="lg"><span class="sq" data-swatch="chart-4" style="background:var(--chart-4)"></span>Yellow 40</div>
    <div class="lg"><span class="sq" data-swatch="chart-5" style="background:var(--chart-5)"></span>Purple 50</div>
    <div class="lg"><span class="sq" data-swatch="chart-6" style="background:var(--chart-6)"></span>Ultra 90</div>
    <div class="lg"><span class="sq" data-swatch="chart-7" style="background:var(--chart-7)"></span>Lime 50</div>
    <div class="lg"><span class="sq" data-swatch="chart-8" style="background:var(--chart-8)"></span>Pink 60</div>
    <div class="lg"><span class="sq" data-swatch="chart-9" style="background:var(--chart-9)"></span>Aqua 40</div>
    <div class="lg"><span class="sq" data-swatch="chart-10" style="background:var(--chart-10)"></span>Green 60</div>
  </div>
</body></html>
