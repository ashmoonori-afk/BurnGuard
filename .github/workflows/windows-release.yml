name: Windows release package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('release-package-{0}', github.ref) || format('release-package-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: bun install --frozen-lockfile
      - name: Verify tagged version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ' }
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test scripts/qa/release-draft-state.test.js
      - run: bun test packages/backend/tests/original-samples.test.ts packages/backend/tests/desktop-lifecycle.test.ts packages/backend/tests/artifact-document-migration.test.ts --timeout 30000
      - name: Build Windows process host
        run: |
          bun scripts/build-windows-process-host.ts
          dotnet build packages/windows-process-host/qa-host/BurnGuard.ProcessHost.Qa.csproj -c Release -o dist/windows-process-host-qa --nologo
      - name: Verify native Windows process host
        id: process_host_qa
        env:
          BG_WINDOWS_PROCESS_HOST: ${{ github.workspace }}\dist\windows-process-host\burnguard-windows-process-host.exe
          BG_WINDOWS_PROCESS_HOST_QA: ${{ github.workspace }}\dist\windows-process-host-qa\burnguard-windows-process-host-qa.exe
          BG_WINDOWS_PROCESS_HOST_EVIDENCE: ${{ github.workspace }}\.omo\evidence\windows-process-host
        run: dotnet run --project packages/windows-process-host/qa/ProcessHostChecks.csproj -c Release
      - name: Upload Windows process host evidence
        if: always() && steps.process_host_qa.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: BurnGuard-Windows-Process-Host-QA
          path: .omo/evidence/windows-process-host/*
          if-no-files-found: error
      - name: Verify owned process cleanup in an isolated runner
        env:
          BG_WINDOWS_PROCESS_HOST: ${{ github.workspace }}\dist\windows-process-host\burnguard-windows-process-host.exe
        run: bun test packages/backend/tests/owned-process-tree.test.ts --timeout 30000
      - run: dotnet run --project packages/desktop-windows/qa/UpdateChecks.csproj -c Release
      - run: bun run build:windows:release
      - name: Verify packaged backend and runtime
        run: node scripts/qa/package-smoke.mjs
      - name: Verify packaged native canvas, persistence, and exports
        run: node scripts/qa/windows-native-smoke.mjs --release
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BurnGuard-Windows-Native-QA
          path: .omo/evidence/windows-native-2026-09-09/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BurnGuard-Windows
          path: dist/releases/*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist/releases -File).FullName
          node scripts/qa/release-draft-state.mjs windows $env:GITHUB_REF_NAME "BurnGuard $env:GITHUB_REF_NAME" 'Windows installer, portable app, and automatic update feed. Publish this draft after checking the package.' @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release attachment failed' }
