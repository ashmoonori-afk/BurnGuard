<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA-magnet</title>
<style>body{margin:0;font-family:system-ui,sans-serif;color:#1a1a1a}nav{display:flex;gap:32px;padding:20px 40px;border-bottom:1px solid #ddd}nav a{color:#123;text-decoration:none}
.hero{padding:48px 40px}.hero h1{font-size:40px;margin:0 0 12px}.hero p{max-width:560px;line-height:1.5}
.btns{display:flex;gap:16px;margin-top:20px}.btn{padding:12px 20px;background:#1d4ed8;color:#fff;border-radius:8px}.btn.alt{background:#e5e7eb;color:#111}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:24px 40px}.card{background:#f3f4f6;border-radius:10px;padding:20px;min-height:120px}
.badge{display:inline-block;padding:4px 10px;background:#fde68a;border-radius:999px;font-size:12px}
@media (max-width:600px){.grid{grid-template-columns:1fr 1fr}nav{gap:16px;padding:16px}}</style></head>
<body><nav><a href="#">QA 홈</a><a href="#">소개</a><a href="#">가격</a><a href="#">문의</a></nav>
<section class="hero"><span class="badge">QA 배지</span><h1>QA 자석 점검 페이지</h1><p>요소를 끌어 옮기고, 크기를 바꾸고, 회전해서 자석이 어디에 붙는지 확인하는 테스트용 페이지예요.</p>
<div class="btns"><a class="btn" href="#">시작하기</a><a class="btn alt" href="#">더 알아보기</a></div></section>
<section class="grid"><div class="card">카드 1</div><div class="card">카드 2</div><div class="card">카드 3</div><div class="card">카드 4</div></section></body></html>
