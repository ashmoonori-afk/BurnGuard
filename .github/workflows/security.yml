name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build:frontend
      - name: Task guidance and reviewed example gate
        run: >-
          bun test --timeout 30000
          packages/backend/tests/prompt-builder.test.ts
          packages/backend/tests/generation-options.test.ts
          packages/backend/tests/preset-observation.test.ts
          packages/backend/tests/task-preset-adoption.test.ts
          packages/backend/tests/task-preset-comparison.test.ts
          packages/backend/tests/task-preset-evidence.test.ts
          packages/backend/tests/visual-craft-skill.test.ts
          packages/frontend/tests/generation-controls-guidance.test.ts
      # The full suite needs a prepared workstation (Chromium, Node bridge,
      # Python + pypdf); see doc/07-manual-smoke-test.md. This gate runs the
      # boundary tests that need none of that.
      - name: Security boundary tests
        run: >-
          bun test --timeout 30000
          packages/backend/tests/request-authority.test.ts
          packages/backend/tests/path-boundary.test.ts
          packages/backend/tests/raw-file-response.test.ts
          packages/backend/tests/app-shell-headers.test.ts
          packages/backend/tests/request-limits.test.ts
          packages/backend/tests/css-source-map-boundary.test.ts
          packages/backend/tests/font-validation.test.ts
          packages/backend/tests/bundled-fonts.test.ts
          packages/backend/tests/bundled-font-reference.test.ts
          packages/backend/tests/daisyui-seed-themes.test.ts
          packages/backend/tests/theme-previews.test.ts
          packages/backend/tests/catalog.test.ts
          packages/backend/tests/artifact-anchor-routes.test.ts
          packages/frontend/tests/quick-comment.test.ts
          packages/frontend/tests/canvas-interaction.test.ts
          packages/frontend/tests/design-system-layout-panel.test.ts
          packages/backend/tests/package-resources.test.ts
          packages/backend/tests/original-samples.test.ts
          packages/backend/tests/owned-process-tree.test.ts
          packages/backend/tests/research-source-loader.test.ts
          packages/backend/tests/session-recovery.test.ts
          packages/backend/tests/review-turn-execution.test.ts
          packages/backend/tests/trace-security.test.ts
          packages/backend/tests/watchers.test.ts
          packages/backend/tests/python-health.test.ts
          packages/backend/tests/turn-error-sanitizer.test.ts
          packages/backend/tests/claude-code-parser.test.ts
          packages/backend/tests/codex-parser.test.ts
          packages/backend/tests/backends-readiness.test.ts
          packages/backend/tests/provider-runner-safety.test.ts
          packages/backend/tests/provider-adapters.test.ts
          packages/backend/tests/multi-provider-backends.test.ts
          packages/backend/tests/graphic-capability.test.ts
          packages/backend/tests/settings-backend-persistence.test.ts
          packages/backend/tests/design-system-surfaces.test.ts
          packages/backend/tests/deck-references.test.ts
          packages/backend/tests/surface-image-language.test.ts
          packages/backend/tests/graphic-contract-defects.test.ts
          packages/backend/tests/content-type-ladder.test.ts
          packages/backend/tests/craft-block-authority.test.ts
          packages/frontend/tests/backend-display.test.ts
          packages/backend/tests/config-storage.test.ts
          packages/backend/tests/mac-updates.test.ts
          packages/backend/tests/app-update-routes.test.ts
          packages/backend/tests/native-binding.test.ts
          packages/backend/tests/charts.test.ts
          packages/backend/tests/image-prompt-recipes.test.ts
          packages/backend/tests/design-direction-contract.test.ts
          packages/backend/tests/design-system-layout.test.ts
          packages/backend/tests/design-direction-workflow.test.ts
          packages/backend/tests/design-direction-renderer.test.ts
          packages/backend/tests/design-direction-routes.test.ts
          packages/backend/tests/design-system-extract.test.ts
          packages/backend/tests/project-import.test.ts
          packages/backend/tests/artifact-history.test.ts
          packages/backend/tests/export-pptx.test.ts
          packages/backend/tests/chromium-node-launch.test.ts
          packages/frontend/tests/artifact-csp.test.ts
          packages/frontend/tests/client.test.ts
      # Advisories with no compatible upstream fix are allowlisted by id.
      # Remove image-size ids when a release after 2.0.2 exists; affected
      # ICNS/JXL/HEIF inputs never reach PPTXGenJS here. Remove the router ids
      # with the planned 7.18+ migration; this client-only app uses neither SSR
      # hydration nor user-controlled navigation targets.
      - name: Dependency audit
        run: >-
          bun audit
          --ignore=GHSA-w3rx-r6r6-pgpr
          --ignore=GHSA-5p2g-fcmc-qvqq
          --ignore=GHSA-wrjc-x8rr-h8h6
          --ignore=GHSA-337j-9hxr-rhxg
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
