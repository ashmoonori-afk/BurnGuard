name: macOS release package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('release-package-{0}', github.ref) || format('release-package-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bun install --frozen-lockfile
      - name: Verify tagged version
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "Tag and app version differ" >&2; exit 1; fi
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test scripts/qa/release-draft-state.test.js
      - run: bun test packages/backend/tests/mac-updates.test.ts packages/backend/tests/app-update-routes.test.ts --timeout 30000
      - name: Build unsigned macOS release
        run: bun run build:mac:release
      - name: Verify the bundled Node renderer runtime
        run: test -x "dist/mac/BurnGuard Design.app/Contents/MacOS/resources/node/node"
      - name: Verify packaged native canvas, persistence, and exports
        run: bun scripts/qa/native-mac-smoke.ts "dist/mac/BurnGuard Design.app" "$RUNNER_TEMP/native-mac-smoke-evidence"
      - name: Verify the downloaded (quarantined) copy under Gatekeeper
        run: |
          set -euo pipefail
          # A browser download carries com.apple.quarantine; the build output does not, so the smoke above never saw Gatekeeper.
          copy_root="$RUNNER_TEMP/quarantined-copy"
          rm -rf "$copy_root"
          mkdir -p "$copy_root"
          ditto "dist/mac/BurnGuard Design.app" "$copy_root/BurnGuard Design.app"
          app="$copy_root/BurnGuard Design.app"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$app"
          xattr -p com.apple.quarantine "$app" >/dev/null
          # Expected state while releases are unsigned and not notarized: Gatekeeper rejects the quarantined copy.
          # When Developer ID signing and notarization exist, flip this to require acceptance (spctl exit 0).
          if spctl --assess --type execute --verbose=4 "$app"; then
            echo "spctl accepted the unsigned quarantined copy; if the release is now Developer ID signed and notarized, update this step to expect acceptance." >&2
            exit 1
          fi
          # README workaround: removing the quarantine attribute makes the copy launchable again.
          xattr -dr com.apple.quarantine "$app"
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "com.apple.quarantine is still present after xattr -dr" >&2
            exit 1
          fi
          bun scripts/qa/native-mac-smoke.ts "$app" "$RUNNER_TEMP/native-mac-smoke-dequarantined-evidence"
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BurnGuard-macOS-Native-QA
          path: |
            ${{ runner.temp }}/native-mac-smoke-evidence/*
            ${{ runner.temp }}/native-mac-smoke-dequarantined-evidence/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BurnGuard-macOS
          path: dist/releases/*
      - name: Attach to the tag's draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows workflow drafts the release for the same tag; whichever job finishes first creates it.
          node scripts/qa/release-draft-state.mjs macos "$GITHUB_REF_NAME" "BurnGuard $GITHUB_REF_NAME" 'Windows and macOS installers, portable apps, and automatic update feeds. Publish only after both the Windows and macOS assets are attached and checked.' dist/releases/*
