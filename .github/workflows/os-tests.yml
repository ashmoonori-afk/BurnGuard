name: OS tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: os-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  os-tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bun install --frozen-lockfile
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - name: Build the Windows process host
        if: runner.os == 'Windows'
        run: |
          bun scripts/build-windows-process-host.ts
          "BG_WINDOWS_PROCESS_HOST=$env:GITHUB_WORKSPACE\dist\windows-process-host\burnguard-windows-process-host.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The native launch/terminate receipt contract the backend relies on; also run by windows-release.yml.
      - name: Verify the native Windows process host
        if: runner.os == 'Windows'
        run: |
          dotnet build packages/windows-process-host/qa-host/BurnGuard.ProcessHost.Qa.csproj -c Release -o dist/windows-process-host-qa --nologo
          $env:BG_WINDOWS_PROCESS_HOST_QA = "$env:GITHUB_WORKSPACE\dist\windows-process-host-qa\burnguard-windows-process-host-qa.exe"
          dotnet run --project packages/windows-process-host/qa/ProcessHostChecks.csproj -c Release
      # Proves the native macOS shell compiles on every pull request, with the flags scripts/build-mac.ts uses.
      - name: Typecheck the native macOS shell
        if: runner.os == 'macOS'
        run: swiftc -typecheck -swift-version 5 -target arm64-apple-macos14.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" packages/desktop-mac/main.swift
      # Suites that need no Chromium, Python or provider CLI. Platform-impossible cases skip themselves; see
      # doc/os-matrix.md for what each suite pins per OS.
      - name: Platform-sensitive suites
        run: >-
          bun test --timeout 30000
          packages/backend/tests/os-portability.test.ts
          packages/backend/tests/decomposed-file-names.test.ts
          packages/backend/tests/artifact-tree-durability.test.ts
          packages/backend/tests/design-system-wireframe.test.ts
          packages/backend/tests/design-system-visual-diff.test.ts
          packages/backend/tests/design-system-hero-assets.test.ts
          packages/frontend/tests/session-stream.test.ts
          packages/frontend/tests/provider-message.test.ts
          packages/backend/tests/extraction-website-acquisition.test.ts
          packages/backend/tests/extraction-website-boundaries.test.ts
          packages/backend/tests/export-naming.test.ts
          packages/backend/tests/design-system-contrast.test.ts
          packages/backend/tests/design-system-starter.test.ts
          packages/frontend/tests/canvas-edit-review.test.ts
          packages/backend/tests/design-system-starter-entrypoint.test.ts
          packages/backend/tests/design-system-layout-reference.test.ts
          packages/backend/tests/design-system-conformance.test.ts
          packages/backend/tests/design-system-pages.test.ts
          packages/backend/tests/design-workflow.test.ts
          packages/backend/tests/generation-output.test.ts
          packages/backend/tests/css-logo-check.test.ts
          packages/backend/tests/structure-extractor.test.ts
          packages/backend/tests/export-validation.test.ts
          packages/backend/tests/vercel-publish.test.ts
          packages/backend/tests/path-boundary.test.ts
          packages/desktop-mac/main.test.ts
          packages/backend/tests/config-storage.test.ts
          packages/backend/tests/native-binding.test.ts
          packages/backend/tests/python-runtime.test.ts
          packages/backend/tests/owned-process-windows.test.ts
          packages/backend/tests/codex-runner.test.ts
          packages/backend/tests/detached-descendant.test.ts
          packages/backend/tests/trace-security.test.ts
          packages/backend/tests/prompt-builder.test.ts
          packages/backend/tests/desktop-lifecycle.test.ts
          packages/frontend/tests/canvas-source.test.ts
          packages/frontend/tests/side-input.test.ts
          packages/frontend/tests/error-copy.test.ts
          packages/frontend/tests/i18n-messages.test.ts
          packages/frontend/tests/tool-badge-copy.test.ts
          packages/frontend/tests/prompt-library.test.ts
          packages/frontend/tests/logo-inspiration.test.ts
          packages/frontend/tests/logo-moodboard-intake.test.ts
          packages/frontend/tests/logo-project.test.ts
          packages/backend/tests/logo-contract.test.ts
          packages/backend/tests/image-fingerprint.test.ts
          packages/backend/tests/logo-moodboard.test.ts
          packages/backend/tests/logo-moodboard-routes.test.ts
          packages/backend/tests/logo-originality.test.ts
          packages/backend/tests/logo-pipeline-state.test.ts
          packages/backend/tests/logo-completion-gate.test.ts
          packages/backend/tests/logo-deliverables.test.ts
          packages/backend/tests/prompt-logo-set.test.ts
          packages/backend/tests/pipeline-repositories.test.ts
          packages/backend/tests/runtime-diagnostics.test.ts
          packages/frontend/tests/runtime-diagnostics.test.ts
          packages/shared/tests/runtime-diagnostics.test.ts
          packages/backend/tests/session-routes.test.ts
          packages/backend/tests/turn-error-sanitizer.test.ts
          scripts/qa/har-mask.test.ts
          scripts/qa/task-8-gates.test.ts
          packages/backend/tests/design-system-extract.test.ts
          packages/backend/tests/project-bundle-routes.test.ts
          packages/backend/tests/design-system-route-error-bodies.test.ts
          packages/backend/tests/export-failure-message.test.ts
          packages/backend/tests/route-unexpected-error-bodies.test.ts
          packages/backend/tests/chromium-capability.test.ts
          packages/backend/tests/chromium-bridge-probe.test.ts
          packages/backend/tests/chromium-browser-paths.test.ts
          packages/backend/tests/export-render-launch.test.ts
          packages/backend/tests/chromium-process-tree.test.ts
          packages/backend/tests/chromium-launch-hardening.test.ts
          scripts/qa/check-os-matrix-coverage.test.ts
          scripts/qa/check-flake-patterns.test.ts
          packages/backend/tests/mac-updates-version-order.test.ts
          packages/backend/tests/task-preset-comparison.test.ts
          packages/backend/tests/codex-model-catalog.test.ts
          packages/backend/tests/model-lists.test.ts
          packages/frontend/tests/backend-restart-notice.test.ts
          packages/frontend/tests/settings-language-note.test.ts
          packages/frontend/tests/workspace-narrow-layout.test.ts
          packages/frontend/tests/chat-status-slot-layout.test.ts
          packages/frontend/tests/generation-controls-guidance.test.ts
      # The first Windows PowerShell start on a runner loads .NET Framework and System.Drawing cold (1-9 s usually, over
      # 25 s on a slow runner), which is the font enumeration's whole limit; it is paid here, outside that limit.
      - name: Warm Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Type -AssemblyName System.Drawing; (New-Object System.Drawing.Text.InstalledFontCollection).Families.Count
      # Host font enumeration and process-tree cleanup; see doc/os-matrix.md for the Windows timing evidence.
      - name: Host fonts and process-tree suites
        run: >-
          bun test --timeout 30000
          packages/backend/tests/local-fonts.test.ts
          packages/backend/tests/owned-process-tree.test.ts
      # The runner has no Playwright build, so the suites launch its system Chrome. The first launch and the first page
      # on a fresh runner are cold starts (3-25 s measured, over 45 s once); they happen here under their own budget,
      # with each channel's result and time in the log, and fail the job by name when no browser starts or renders.
      # See doc/os-matrix.md.
      - name: Warm the system browser
        run: bun scripts/warm-browser.ts
      - name: Install the fixture browser
        run: node packages/backend/node_modules/playwright-core/cli.js install chromium
      - name: Browser-backed suites
        env:
          BG_BROWSER_SMOKE: "1"
        run: >-
          bun test --timeout 60000
          packages/backend/tests/design-system-pages.test.ts
          packages/backend/tests/design-system-conformance.test.ts
          packages/backend/tests/design-system-contrast.test.ts
          packages/backend/tests/design-system-starter.test.ts
          packages/frontend/tests/deck-sandbox.browser.test.ts
      - name: Chromium popup and deck runtime
        if: runner.os == 'Windows'
        env:
          BG_BROWSER_SMOKE: "1"
        run: bun test --timeout 60000 packages/backend/tests/chromium-node-launch.test.ts
      - name: Export smoke
        env:
          BG_EXPORT_SMOKE: "1"
        run: bun test --timeout 120000 packages/backend/tests/exports.test.ts
