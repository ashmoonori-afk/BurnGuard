<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><title>Colors · Accent ramps</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background:var(--bg); font-family: var(--font-sans); }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 10px; }
  .ramp { display:grid; grid-template-columns: 90px repeat(10, minmax(0, 1fr)); align-items:center; gap: 0; margin-bottom: 6px; }
  .name { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .sw { height: 28px; }
  .name + .sw { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .sw:last-of-type { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
</style></head>
