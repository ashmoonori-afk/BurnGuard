nt-weight:bold}h3,.stamp{font-family:var(--font-display);font-weight:400}h1[lang=ko],h2[lang=ko],h3[lang=ko]{font-family:var(--font-body);font-weight:700;line-height:1.12;letter-spacing:-.04em}html{font-synthesis:none}h1,h2,h3{word-break:keep-all}h1[lang=ko],h2[lang=ko],h3[lang=ko]{line-height:1.12}</style></head><body><main class="poster" data-bg-node-id="poster"><div class="row label"><span>ODDWARD / Studio lab</span><span>Type. Form. Friction.</span></div><h1 data-bg-node-id="poster-title">MAKE<br>A GOOD<br>WRONG.</h1><img src="assets/hero.png" data-bg-node-id="poster-image" alt="라임 받침 위 크롬 매듭과 마젠타 패널"><div class="stamp" data-bg-node-id="stamp">질문을<br>비틀어<br>보세요 ↗</div><p class="caption" data-bg-node-id="caption">익숙한 답 바깥에서 시작하는<br>오리지널 크리에이티브 연구.</p><footer>Original concept · BurnGuard sample <span>ODDWARD ↗</span></footer></main></body></html>
